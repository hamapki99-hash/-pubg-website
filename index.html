<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Hacks - VX Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        :root {
            --primary: #fca311;
            --dark: #14213d;
            --black: #000000;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(252, 163, 17, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--black);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at center, #14213d 0%, #000000 100%);
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .badge {
            background: var(--primary);
            color: var(--black);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            color: #a0a0a0;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .features {
            text-align: right;
            margin-bottom: 25px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .feature-item::before {
            content: "✓";
            color: var(--primary);
            font-weight: bold;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: var(--black);
            text-decoration: none;
            font-weight: 700;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(252, 163, 17, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(252, 163, 17, 0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">VX Edition</span>
        <h1>PUBG Hacks</h1>
        <p>بخێربهێی بۆ مالپەرێ فەرمی یێ هاكێن ببجی ب كوالیتییا بەرز و پاراستی.</p>
        
        <div class="features">
            <div class="feature-item">بێ ئاریشە و دژى بانی (Anti-Ban)</div>
            <div class="feature-item">سەرراستکرنا ئارمانجێ (Aimbot)</div>
            <div class="feature-item">کاشفکرنا شوێنێن دژمنی (ESP/X-Ray)</div>
            <div class="feature-item">پشتگیرییا نووترین ئەپدێت</div>
        </div>

        <a href="#" class="btn">داگرتن / Download</a>
    </div>

</body>
</html>
