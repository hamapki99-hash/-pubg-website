<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Hacks - VX Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        :root {
            --primary: #fca311;
            --dark: #14213d;
            --black: #000000;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--black);
            color: white;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1f4068 0%, #000000 100%);
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            color: var(--primary);
        }

        p {
            font-size: 1.2rem;
            color: #e5e5e5;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="container">
        <h1>PUBG Hacks - VX Edition</h1>
        <p>بهێزترین سیسته‌مێ یاریێ ب كوالتییا بەرز</p>
    </div>
</body>
</html>
